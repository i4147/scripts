<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF.js Android Offline Bundler</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; padding: 20px; margin: 0; }
        .box { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #444; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #bbb; }
        input[type="file"] { background: #444; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; color: #fff; }
        button { background: #007acc; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:active { background: #005999; }
        .status { margin-top: 10px; font-size: 14px; color: #88ff88; display: none; }
    </style>
</head>
<body>

    <h2>📦 PDF.js Android Offline Bundler</h2>
    <p>Chrome blocks local file access due to security restrictions. Use this tool to merge your local files into a single self-contained HTML file.</p>

    <div class="box">
        <label>1. Select your local "pdf.js" file:</label>
        <input type="file" id="pdf-js-file">
    </div>

    <div class="box">
        <label>2. Select your local "pdf.worker.js" file:</label>
        <input type="file" id="pdf-worker-file">
    </div>

    <button id="build-btn">⚡ Generate Self-Contained HTML Viewer</button>
    <div id="status-msg" class="status"></div>

    <script>
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    // Extract only the raw base64 string parts
                    let base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('build-btn').addEventListener('click', async function() {
            const pdfJsInput = document.getElementById('pdf-js-file').files[0];
            const workerJsInput = document.getElementById('pdf-worker-file').files[0];
            const statusMsg = document.getElementById('status-msg');

            if (!pdfJsInput || !workerJsInput) {
                alert("Please select both pdf.js and pdf.worker.js files first.");
                return;
            }

            statusMsg.style.display = "block";
            statusMsg.textContent = "Processing files and encoding to Base64...";

            try {
                const pdfJsBase64 = await fileToBase64(pdfJsInput);
                const workerJsBase64 = await fileToBase64(workerJsInput);

                // This template injects the Base64 script directly as data URIs
                const finalHtmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100% Offline PDF Viewer</title>
    <!-- Inlined Core PDF.js Library via Base64 Data URI -->
    <script src="data:text/javascript;base64,${pdfJsBase64}"><\/script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #333; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        #toolbar { background-color: #222; padding: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 10; }
        button, input[type="file"] { background-color: #444; color: white; border: 1px solid #555; padding: 8px 12px; border-radius: 4px; font-size: 14px; }
        button:active { background-color: #666; }
        #page-info { font-size: 14px; }
        #viewer-container { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 10px; }
        canvas { background-color: white; box-shadow: 0 4px 8px rgba(0,0,0,0.3); max-width: 100%; height: auto !important; }
    </style>
</head>
<body>

    <div id="toolbar">
        <input type="file" id="file-selector" accept=".pdf">
        <button id="prev-btn">◀ Prev</button>
        <span id="page-info">Page: <span id="page-num">0</span> / <span id="page-count">0</span></span>
        <button id="next-btn">Next ▶</button>
    </div>

    <div id="viewer-container">
        <canvas id="pdf-canvas"></canvas>
    </div>

    <script>
        // Inline PDF.js Worker Configuration via Base64 Data URI
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'data:text/javascript;base64,${workerJsBase64}';
        } else {
            alert("Critical Error: Inlined pdf.js failed to execute correctly.");
        }

        var pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null,
            canvas = document.getElementById('pdf-canvas'), ctx = canvas.getContext('2d');

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                var viewport = page.getViewport({ scale: 1.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                var renderContext = { canvasContext: ctx, viewport: viewport };
                
                page.render(renderContext).promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });
            document.getElementById('page-num').textContent = num;
        }

        function queueRenderPage(num) {
            if (pageRendering) { pageNumPending = num; } else { renderPage(num); }
        }

        document.getElementById('prev-btn').addEventListener('click', function() {
            if (pageNum <= 1) return; pageNum--; queueRenderPage(pageNum);
        });

        document.getElementById('next-btn').addEventListener('click', function() {
            if (pageNum >= pdfDoc.numPages) return; pageNum++; queueRenderPage(pageNum);
        });

        document.getElementById('file-selector').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var fileReader = new FileReader();
            fileReader.onload = function() {
                var typedarray = new Uint8Array(this.result);
                pdfjsLib.getDocument({data: typedarray}).promise.then(function(pdfDoc_) {
                    pdfDoc = pdfDoc_;
                    document.getElementById('page-count').textContent = pdfDoc.numPages;
                    pageNum = 1;
                    renderPage(pageNum);
                }).catch(function(err) {
                    alert("Render Error: " + err.message);
                });
            };
            fileReader.readAsArrayBuffer(file);
        });
    <\/script>
</body>
</html>`;

                // Force browser download of the newly built standalone file
                const blob = new Blob([finalHtmlContent], { type: "text/html" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "offline_viewer.html";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                statusMsg.textContent = "Success! 'offline_viewer.html' has been generated and downloaded to your device.";
            } catch (err) {
                statusMsg.style.color = "#ff8888";
                statusMsg.textContent = "Error compiling file: " + err.message;
            }
        });
    </script>
</body>
</html>
